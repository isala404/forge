[package]
name = "forge-node"
version = "0.1.0"
edition = "2021"
publish = false
description = "Node.js (napi-rs) bindings for Forge — kv + queue from JavaScript"

[lib]
crate-type = ["cdylib"]

[dependencies]
forge = { package = "forge-rs", path = "../.." }
napi = { version = "2", default-features = false, features = ["napi6", "tokio_rt"] }
napi-derive = "2"
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
