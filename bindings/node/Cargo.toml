[package]
name = "forgelib-node"
version = "1.0.0"
edition = "2021"
publish = false
description = "Node.js (napi-rs) bindings for Forge — hardened infra primitives on Postgres"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Enable OTLP export so the prebuilt binding ships with observability wired in.
forgelib = { path = "../..", features = ["otel"] }
futures-util = "0.3"
napi = { version = "2", default-features = false, features = ["napi6", "tokio_rt"] }
napi-derive = "2"
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
