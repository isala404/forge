[package]
name = "forgelib-node"
version = "1.0.0"
edition = "2021"
publish = false
description = "Node.js (napi-rs) bindings for Forge — hardened infra primitives on Postgres"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Enable OTLP export so the prebuilt binding ships with observability wired in, and the
# embedded Postgres backend so `url = "embedded"` works with no external database (an
# external Postgres URL still works exactly as before — embedded is opt-in per app).
forgelib = { path = "../..", features = ["otel", "embedded-postgres"] }
futures-util = "0.3"
napi = { version = "2", default-features = false, features = ["napi6", "tokio_rt"] }
napi-derive = "2"
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
