[package]
name = "forgelib-node"
version = "1.1.0"
edition = "2024"
publish = false
description = "Node.js (napi-rs) bindings for Forge — hardened infra primitives on Postgres"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Enable OTLP export and the embedded Postgres server so the prebuilt binding
# ships with both wired in ([postgres] embedded = true works out of the box).
forgelib = { path = "../..", features = ["otel", "embedded"] }
futures-util = "0.3"
serde_json = "1"
napi = { version = "3", default-features = false, features = ["napi6", "tokio_rt"] }
napi-derive = "3"
tokio = { version = "1", features = ["sync", "macros", "fs", "io-util"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
