[package]
name = "forge-py"
version = "0.1.0"
edition = "2021"
publish = false
description = "Python (pyo3) bindings for Forge — a representative slice of every primitive"

# Build with maturin: `maturin develop` (dev) or `maturin build --release`.
[lib]
name = "forge_py"
crate-type = ["cdylib"]

[dependencies]
forge = { path = "../.." }
# abi3-py39: build against the stable ABI so one wheel runs on CPython >= 3.9
# (including newer interpreters than this pyo3 release knows about).
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
# Native async: every method returns a Python awaitable driven on a shared Tokio
# runtime, so callers `await` the binding directly (no thread-pool wrapper).
pyo3-async-runtimes = { version = "0.23", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
futures-util = { version = "0.3", default-features = false }

[profile.release]
lto = true
strip = "symbols"
