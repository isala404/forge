[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "forge-py"
version = "1.0.0"
description = "Python bindings for Forge — hardened infra primitives on Postgres"
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
]

[tool.maturin]
module-name = "forge_py"
# Mixed layout: ship the pure-Python typed projection (forge_typed) alongside the
# compiled forge_py extension.
python-source = "python"
auditwheel = "repair"
