[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "forge-py"
version = "0.1.0"
description = "Python bindings for Forge — hardened infra primitives on Postgres"
requires-python = ">=3.9"
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
module-name = "forge_py"
