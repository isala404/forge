name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without v prefix
        required: true
        default: 1.1.0
      release_tag:
        description: Existing Git tag to release from
        required: true
        default: v1.1.0
      dry_run:
        description: Build and verify without publishing
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      baseline_ref:
        description: Last compatible Forge release
        required: true
        default: v1.0.1

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  preflight:
    name: Tagged release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - name: Verify tag and version identity
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$TAG" = "v$VERSION"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")"
          python3 tools/release/check.py --version "$VERSION"
      - run: python3 tools/contract/generate.py --check --release
      - run: python3 tools/go-migrations/generate.py --check
      - run: python3 tools/go-conformance/generate.py --check
      - run: python3 tools/schema-ownership/check.py
      - run: python3 tools/api-contract/check.py
      - run: python3 tools/api-compat/check.py --baseline "${{ inputs.baseline_ref }}"

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: preflight
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path bindings/node/Cargo.toml -- --check
      - run: cargo fmt --manifest-path bindings/python/Cargo.toml -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --manifest-path bindings/node/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path bindings/python/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --features conformance --test memory_conformance
      - run: go test ./...
        working-directory: bindings/go
      - run: go test -race ./...
        working-directory: bindings/go

  rust-semver:
    name: Rust compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.48.0
      - name: Record the declared 1.0-to-1.1 reset
        if: ${{ inputs.version == '1.1.0' }}
        run: echo "1.1.0 is the declared compatibility reset; generated migration and contract checks are the release gate."
      - name: Check Rust semantic-version compatibility
        if: ${{ inputs.version != '1.1.0' }}
        run: cargo semver-checks check-release --release-type minor --baseline-rev "${{ inputs.baseline_ref }}"

  postgres:
    name: PostgreSQL conformance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: quality
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/forge
      FORGE_REQUIRE_POSTGRES_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - uses: astral-sh/setup-uv@v6
      - run: cargo test --locked --features pg-tests -- --test-threads=4
      - run: bash tools/conformance/run-all.sh

  rust-package:
    name: Rust package
    runs-on: ubuntu-latest
    needs: [quality, rust-semver, postgres]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package --locked
      - name: Test exact crate contents
        run: |
          set -euo pipefail
          mkdir crate-smoke
          tar -xzf target/package/forgelib-${{ inputs.version }}.crate -C crate-smoke
          cargo test --manifest-path crate-smoke/forgelib-${{ inputs.version }}/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: release-rust
          path: target/package/forgelib-${{ inputs.version }}.crate
          if-no-files-found: error

  node-native:
    name: Node native ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    needs: [quality, postgres]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux-x64-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, platform: linux-x64-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64-gnu }
          - { os: macos-14, target: aarch64-apple-darwin, platform: darwin-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: win32-x64-msvc }
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Zig for musl cross-compilation
        if: ${{ matrix.musl == true }}
        uses: mlugg/setup-zig@v2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build native addon
        if: ${{ matrix.musl != true }}
        run: npm run build -- --target ${{ matrix.target }}
      - name: Build native addon with musl
        if: ${{ matrix.musl == true }}
        run: npm run build -- --target ${{ matrix.target }} --cross-compile
      - name: Load native addon
        if: ${{ matrix.musl != true }}
        run: node -e "require('./forgelib.${{ matrix.platform }}.node')"
      - name: Load native addon on musl
        if: ${{ matrix.musl == true }}
        run: docker run --rm -v "$PWD:/package" -w /package node:24-alpine node -e "require('./forgelib.${{ matrix.platform }}.node')"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: bindings/node/forgelib.${{ matrix.platform }}.node
          if-no-files-found: error

  npm-package:
    name: npm package
    runs-on: ubuntu-latest
    needs: node-native
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: bindings/node
          merge-multiple: true
      - name: Build and install exact tarball
        working-directory: bindings/node
        run: |
          set -euo pipefail
          npm pack --ignore-scripts
          for platform in linux-x64-gnu linux-x64-musl linux-arm64-gnu darwin-arm64 win32-x64-msvc; do
            tar -tzf "forgelib-${{ inputs.version }}.tgz" | grep -qx "package/forgelib.$platform.node"
          done
          mkdir package-smoke
          npm install --prefix package-smoke "./forgelib-${{ inputs.version }}.tgz" @openfeature/server-sdk@1.23.0
          node -e "require('./package-smoke/node_modules/forgelib')"
          node -e "require('./package-smoke/node_modules/forgelib/openfeature')"
      - uses: actions/upload-artifact@v4
        with:
          name: release-npm
          path: bindings/node/forgelib-${{ inputs.version }}.tgz
          if-no-files-found: error

  python-wheel:
    name: Python wheel ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    needs: [quality, postgres]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64, manylinux: "2_28" }
          - { os: macos-14, target: aarch64-apple-darwin, platform: darwin-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: win32-x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --locked --manifest-path bindings/python/Cargo.toml --release --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
      - name: Install exact wheel
        run: >-
          python -c "import glob,subprocess,sys; wheels=glob.glob('dist/*.whl'); assert len(wheels)==1, wheels; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall',wheels[0]])"
      - run: python -c "import forgelib; assert forgelib.ForgeClient is not None"
      - run: python bindings/python/test/native_memory_testing.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  python-package:
    name: Python packages
    runs-on: ubuntu-latest
    needs: python-wheel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uvx --from 'maturin>=1.5,<2' maturin sdist --manifest-path bindings/python/Cargo.toml --out dist
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Check and install exact distributions
        run: |
          set -euo pipefail
          uvx twine check dist/*
          uv venv sdist-smoke
          uv pip install --python sdist-smoke/bin/python dist/*.tar.gz
          sdist-smoke/bin/python -c "import forgelib; assert forgelib.ForgeClient is not None"
      - uses: actions/upload-artifact@v4
        with:
          name: release-python
          path: dist/*
          if-no-files-found: error

  python-runtime:
    name: Python ${{ matrix.python }} packaged wheel
    runs-on: ubuntu-latest
    needs: python-package
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: release-python
          path: python-dist
      - name: Install and load exact abi3 wheel
        run: |
          python -c "import glob,subprocess,sys; wheels=glob.glob('python-dist/*x86_64*.whl'); assert len(wheels)==1, wheels; subprocess.check_call([sys.executable,'-m','pip','install',wheels[0]])"
          python -c "import forgelib; assert forgelib.ForgeClient is not None"

  go-package:
    name: Go module
    runs-on: ubuntu-latest
    needs: [quality, postgres]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - name: Archive and test exact module contents
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=forgelib-go-${{ inputs.version }}/ --output=forgelib-go-${{ inputs.version }}.tar.gz HEAD:bindings/go
          mkdir go-smoke
          tar -xzf forgelib-go-${{ inputs.version }}.tar.gz -C go-smoke --strip-components=1
          (cd go-smoke && go test ./...)
      - uses: actions/upload-artifact@v4
        with:
          name: release-go
          path: forgelib-go-${{ inputs.version }}.tar.gz
          if-no-files-found: error

  supply-chain:
    name: Scan, SBOM, checksums, and provenance
    runs-on: ubuntu-latest
    needs: [rust-package, npm-package, python-package, python-runtime, go-package]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: bundle
          merge-multiple: true
      - name: Scan release dependencies, artifacts, and secrets
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: bundle
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: bundle
          format: spdx-json
          output-file: bundle/forge-${{ inputs.version }}.spdx.json
          upload-artifact: false
      - name: Generate checksums
        working-directory: bundle
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Attest artifact provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            bundle/*.crate
            bundle/*.tgz
            bundle/*.whl
            bundle/*.tar.gz
      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            bundle/*.crate
            bundle/*.tgz
            bundle/*.whl
            bundle/*.tar.gz
          sbom-path: bundle/forge-${{ inputs.version }}.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: bundle/*
          if-no-files-found: error

  publish:
    name: Coordinated publish
    runs-on: ubuntu-latest
    needs: supply-chain
    if: ${{ inputs.dry_run == 'false' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-rust
          path: rust-dist
      - uses: actions/download-artifact@v4
        with:
          name: release-npm
          path: npm-dist
      - uses: actions/download-artifact@v4
        with:
          name: release-python
          path: python-dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-auth
      - name: Publish Rust crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --locked
      - name: Publish npm tarball
        run: npm publish npm-dist/forgelib-${{ inputs.version }}.tgz --access public
      - name: Publish Python distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist
      - name: Publish Go module tag
        env:
          TAG: bindings/go/v${{ inputs.version }}
        run: |
          set -euo pipefail
          current="$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)"
          if [[ -n "$current" ]]; then
            test "$current" = "$(git rev-parse HEAD)"
            exit 0
          fi
          git tag "$TAG" HEAD
          git push origin "refs/tags/$TAG"

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [publish, supply-chain]
    if: ${{ inputs.dry_run == 'false' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: bundle
      - name: Publish release notes and verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$TAG" bundle/* --verify-tag --title "Forge $VERSION" --generate-notes
