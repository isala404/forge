---
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (validate + test without publishing)
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: forge
  SQLX_OFFLINE: "true"
  FORGE_TEST_ARTIFACT_DIR: /tmp/forge-test-artifacts

jobs:
  parse-changelog:
    name: Changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      release_date: ${{ steps.parse.outputs.release_date }}
      release_notes: ${{ steps.parse.outputs.release_notes }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4.2.2
      - id: parse
        run: bash scripts/ci/parse-changelog.sh

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.7.7
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/ci/create-env-stubs.sh
      - uses: taiki-e/install-action@v2.49.10
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check
      - run: cargo audit --deny warnings
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --workspace -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p forgex
      - uses: actions/upload-artifact@v4.4.3
        with:
          name: forge-cli
          path: target/debug/forge
          retention-days: 1

  test-template:
    name: ${{ matrix.template }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - with-svelte/minimal
          - with-svelte/demo
          - with-svelte/realtime-todo-list
          - with-dioxus/minimal
          - with-dioxus/demo
          - with-dioxus/realtime-todo-list
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.7
        with:
          shared-key: template-build
          workspaces: /tmp/test-project -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: oven-sh/setup-bun@v2.0.2
      - uses: actions/download-artifact@v4.1.8
        with:
          name: forge-cli
          path: /tmp/forge-bin
      - run: chmod +x /tmp/forge-bin/forge
      - if: startsWith(matrix.template, 'with-dioxus/')
        uses: cargo-bins/cargo-binstall@v1.10.20
      - if: startsWith(matrix.template, 'with-dioxus/')
        run: cargo binstall dioxus-cli@0.7.5 --no-confirm
      - run: scripts/ci/test-template.sh "${{ matrix.template }}" /tmp/forge-bin/forge "${{ github.workspace }}"
      - if: failure()
        run: echo "ARTIFACT_NAME=playwright-${TEMPLATE//\//-}" >> "$GITHUB_ENV"
        env:
          TEMPLATE: ${{ matrix.template }}
      - uses: actions/upload-artifact@v4.4.3
        if: failure()
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/forge-test-artifacts/**
          retention-days: 7

  bump-versions:
    name: Bump Versions
    needs: [parse-changelog, validate, test-template]
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.7
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-edit --locked --version 0.13.6
      - run: scripts/ci/bump-versions.sh "${{ needs.parse-changelog.outputs.version }}"
      - id: commit
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
            git diff --stat
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            git commit -m "Bump version to ${{ needs.parse-changelog.outputs.version }}"
            # Pre-flight: if branch protection rejects direct pushes, surface
            # that as a loud error instead of letting `git push` fail with a
            # generic "remote rejected" line buried in the log.
            REPO="${GITHUB_REPOSITORY:-${{ github.repository }}}"
            if gh api "repos/$REPO/branches/main/protection" >/dev/null 2>&1; then
              echo "::error::main has branch protection; the release pipeline must push the version bump via a PR or have the bot enrolled in the protection bypass list." >&2
              exit 1
            fi
            git push origin main
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [parse-changelog, bump-versions]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-14
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.bump-versions.outputs.commit_sha }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.7.7
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release --target ${{ matrix.target }} -p forgex
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - run: cd target/${{ matrix.target }}/release && tar czvf ../../../${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz ${{ env.BINARY_NAME }}
      - uses: actions/upload-artifact@v4.4.3
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz

  release:
    name: Release
    if: ${{ inputs.dry_run != true }}
    needs: [parse-changelog, bump-versions, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.bump-versions.outputs.commit_sha }}
      - run: |
          TAG="v${{ needs.parse-changelog.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin, skipping tag creation"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
      - uses: actions/download-artifact@v4.1.8
        with:
          path: artifacts
      - run: cd artifacts && for dir in */; do cd "$dir" && for f in *; do sha256sum "$f" > "$f.sha256"; done && cd ..; done
      - uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: v${{ needs.parse-changelog.outputs.version }}
          name: ${{ needs.parse-changelog.outputs.version }} - ${{ needs.parse-changelog.outputs.release_date }}
          body: ${{ needs.parse-changelog.outputs.release_notes }}
          generate_release_notes: true
          prerelease: ${{ needs.parse-changelog.outputs.is_prerelease == 'true' }}
          files: artifacts/**/*

  publish-crates:
    name: Publish crates.io
    if: ${{ inputs.dry_run != true }}
    needs: [parse-changelog, bump-versions, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.bump-versions.outputs.commit_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.7
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish_crate() {
            local output
            output=$(cargo publish "$@" 2>&1) || {
              if echo "$output" | grep -Eq "already uploaded|already exists on crates.io"; then
                echo "$output" | tail -3
                echo "(treated as success: version already on crates.io)"
                return 0
              fi
              echo "$output"
              return 1
            }
            echo "$output"
          }
          # sqlx offline cache lives at the workspace root but cargo publish
          # only packages files under each crate dir
          for crate_dir in crates/forge-core crates/forge-runtime crates/forge; do
            cp -r .sqlx "$crate_dir/.sqlx"
          done
          # Guard --allow-dirty: only .sqlx/ paths may appear in the working tree
          dirty=$(git status --porcelain | awk '{print $2}' | grep -v '\.sqlx/' || true)
          if [ -n "$dirty" ]; then
            echo "::error::working tree has unexpected dirty paths beyond .sqlx/:"
            echo "$dirty"
            exit 1
          fi

          wait_for_crate() {
            local crate=$1 version=$2 elapsed=0
            echo "Waiting for $crate@$version on crates.io index..."
            while [ $elapsed -lt 120 ]; do
              if curl -sf "https://crates.io/api/v1/crates/$crate/$version" | grep -q '"version"'; then
                echo "$crate@$version is indexed"
                return 0
              fi
              sleep 5
              elapsed=$((elapsed + 5))
            done
            echo "Warning: $crate@$version not yet indexed after 120s, proceeding anyway"
          }
          VERSION="${{ needs.parse-changelog.outputs.version }}"

          for pkg in forge-macros forge-core forge-runtime forge-codegen; do
            publish_crate -p $pkg --allow-dirty
            wait_for_crate "$pkg" "$VERSION"
          done
          publish_crate --manifest-path packages/forge-dioxus/Cargo.toml --allow-dirty
          wait_for_crate "forge-dioxus" "$VERSION"
          bash scripts/build-template-archive.sh
          publish_crate -p forgex --allow-dirty

  publish-npm:
    name: Publish npm
    if: ${{ inputs.dry_run != true }}
    needs: [parse-changelog, bump-versions, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.bump-versions.outputs.commit_sha }}
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.parse-changelog.outputs.version }}
        run: |
          cd packages/forge-svelte
          PUBLISHED=$(npm view "@forge-rs/svelte@${VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "@forge-rs/svelte@${VERSION} already published, skipping"
            exit 0
          fi
          npm publish --access public
