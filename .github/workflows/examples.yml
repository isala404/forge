name: Canonical examples

on:
  pull_request:
    paths:
      - "examples/**"
      - "bindings/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/examples.yml"
  push:
    branches: [main, rewrite]
    paths:
      - "examples/**"
      - "bindings/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/examples.yml"

concurrency:
  group: examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  rust-todo:
    name: Rust · todo app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: todoapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d todoapp"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FORGE_POSTGRES_URL: postgres://postgres:forge@127.0.0.1:5432/todoapp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/todoapp/rust-be
      - run: cargo fmt --check
        working-directory: examples/todoapp/rust-be
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: examples/todoapp/rust-be
      - run: cargo build
        working-directory: examples/todoapp/rust-be
      - run: cargo test
        working-directory: examples/todoapp/rust-be
      - name: Start canonical backend
        run: |
          (cd examples/todoapp/rust-be && PORT=9081 cargo run > /tmp/todo-rust.log 2>&1) &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9081/healthz >/dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: Dump logs
        if: failure()
        run: tail -n 300 /tmp/todo-rust.log

  node-chat:
    name: JavaScript · chat app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/node
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
        working-directory: bindings/node
      - run: bun install --frozen-lockfile
        working-directory: examples/chatapp/node-be
      - run: bun run codegen && bun run typecheck && bun run lint && bun run test
        working-directory: examples/chatapp/node-be
  python-links:
    name: Python · links app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: linksapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d linksapp"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FORGE_POSTGRES_URL: postgres://postgres:forge@127.0.0.1:5432/linksapp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen && uv run ruff check
        working-directory: examples/linksapp/python-be
      - run: uv run python -m unittest discover -s test -v
        working-directory: examples/linksapp/python-be
      - name: Start canonical backend
        run: |
          .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 9093 > /tmp/links-python.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true; wait "$backend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9093/healthz >/dev/null && exit 0
            sleep 2
          done
          exit 1
        working-directory: examples/linksapp/python-be
      - name: Dump logs
        if: failure()
        run: tail -n 300 /tmp/links-python.log

  go-worker:
    name: Go · worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - run: go test ./... && go build ./examples/worker
        working-directory: bindings/go
