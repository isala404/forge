# ci.yml ignores "**.md", so a PR touching only the skill's markdown would skip
# the drift guards that exist precisely for those files. This workflow fills that
# gap; it is cheap (no toolchain, no build) and overlaps ci.yml harmlessly.
name: Drift Guards

on:
  pull_request:
    paths:
      - "skills/**"
      - "tools/skill-check/**"
      - "tools/api-contract/**"
      - "tools/api-compat/**"
      - "tools/contract/**"
      - "tools/go-migrations/**"
      - "tools/go-conformance/**"
      - "tools/lifecycle/**"
      - "contract/**"
      - "src/migrations/**"
      - "src/conformance/scenarios/**"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "tools/skill-check/**"
      - "tools/api-contract/**"
      - "tools/api-compat/**"
      - "tools/contract/**"
      - "tools/go-migrations/**"
      - "tools/go-conformance/**"
      - "contract/**"
      - "src/migrations/**"
      - "src/conformance/scenarios/**"

permissions:
  contents: read

jobs:
  drift-guards:
    name: Skill and API contract guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - name: client libraries match the core API contract
        run: python3 tools/api-contract/check.py
      - name: generated contract files are current
        run: python3 tools/contract/generate.py --check
      - name: Go migrations match canonical SQL
        run: python3 tools/go-migrations/generate.py --check
      - name: Go conformance fixtures match canonical scenarios
        run: python3 tools/go-conformance/generate.py --check
      - name: Schema ownership manifest matches canonical SQL
        run: python3 tools/schema-ownership/check.py
      - name: lifecycle ownership guard
        run: python3 tools/lifecycle/check.py
      - name: skill names match the bindings (skill drift guard)
        run: python3 tools/skill-check/check.py
