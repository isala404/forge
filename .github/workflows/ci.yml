name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE*'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE*'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  CARGO_INCREMENTAL: "0"
  FORGE_TEST_ARTIFACT_DIR: /tmp/forge-test-artifacts

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.7.7
        with:
          shared-key: ci
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: fmt
        run: cargo fmt --all --check

      - run: scripts/ci/create-env-stubs.sh

      - name: clippy
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

      - name: test
        run: cargo test --workspace

  slim-presets:
    name: Slim presets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        preset: [worker, api, minimal]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.7
        with:
          shared-key: ci
          save-if: "false"
      - run: scripts/ci/create-env-stubs.sh
      - name: check ${{ matrix.preset }}
        run: cargo check -p forgex --no-default-features --features ${{ matrix.preset }}

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2.7.7
        with:
          shared-key: msrv
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/ci/create-env-stubs.sh
      - run: cargo check --workspace --all-features

  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.7
        with:
          shared-key: ci
          save-if: "false"

      - uses: taiki-e/install-action@v2.49.10
        with:
          # Pin exact versions: an unpinned cargo-deny drifted to a release that
          # rejects deny.toml's `unmaintained = "workspace"` key, failing the job
          # while local (0.19.5) passed. These are the versions verified locally.
          tool: cargo-deny@0.19.5,cargo-audit@0.22.1

      - name: cargo deny
        run: cargo deny check

      - name: cargo audit
        run: cargo audit --deny warnings

  sqlx-cache:
    name: SQLx cache integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.7
        with:
          shared-key: ci
          save-if: "false"
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --locked --version 0.8.6 --no-default-features --features rustls,postgres
      - name: Apply system migrations
        run: |
          for f in crates/forge-runtime/migrations/system/v*.sql; do
            psql -U postgres -h localhost -p 5433 -d forge -f "$f"
          done
        env:
          PGPASSWORD: postgres
      - name: Apply example migrations
        run: |
          psql -U postgres -h localhost -p 5433 -d forge \
            -f examples/with-svelte/demo/migrations/0001_initial.sql
          psql -U postgres -h localhost -p 5433 -d forge \
            -f examples/with-svelte/realtime-todo-list/migrations/0001_todos.sql
          psql -U postgres -h localhost -p 5433 -d forge -c "
            CREATE TABLE IF NOT EXISTS counters (
              id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
              name VARCHAR(255) NOT NULL UNIQUE,
              value BIGINT NOT NULL DEFAULT 0,
              updated_by UUID REFERENCES users(id),
              updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
            );"
        env:
          PGPASSWORD: postgres
      - run: scripts/ci/create-env-stubs.sh
      - name: Regenerate .sqlx cache
        run: cargo sqlx prepare --workspace -- --all-targets --all-features
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/forge
          SQLX_OFFLINE: "false"
      - name: Verify cache is up to date
        run: git diff --exit-code .sqlx/

  codegen-typecheck:
    name: Codegen typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.7
        with:
          shared-key: ci
          save-if: "false"
      - uses: oven-sh/setup-bun@v2.0.2
      - run: scripts/ci/create-env-stubs.sh
      - name: Typecheck generated frontend bindings
        run: scripts/ci/typecheck-codegen.sh
      - name: Verify committed bindings are up to date
        run: git diff --exit-code examples/with-svelte/*/frontend/src/lib/forge

  workspace-integration:
    name: Workspace integration
    needs: [validate, guardrails]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/forge_ci
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.7
        with:
          shared-key: ci
          save-if: "false"
      - run: cargo test -p forge-svelte-demo-template --features testcontainers
      - run: cargo test -p todo --features testcontainers
      - run: cargo test -p todo-dioxus --features testcontainers
      - run: cargo test -p forge-harness --features testcontainers
      # forge-runtime's own integration suite (jobs queue, change_log, leader
      # election, migration runner, signals, KV) — previously never run in CI,
      # so it had rotted. Two non-obvious requirements:
      #   * `full` — every subsystem is #[cfg(feature)]-gated; bare
      #     `testcontainers` compiles and runs ZERO subsystem tests (silent no-op).
      #   * `--test-threads=1` — these tests exercise PG instance-global state
      #     (advisory locks, pg_terminate_backend, leader election) that cannot
      #     run concurrently against one shared database without interfering.
      - run: cargo test -p forge-runtime --features "full,testcontainers" -- --test-threads=1

  pr-smoke:
    name: PR Smoke
    needs: [validate, guardrails]
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        template:
          - with-svelte/minimal
          - with-svelte/demo
          - with-svelte/realtime-todo-list
          - with-dioxus/minimal
          - with-dioxus/demo
          - with-dioxus/realtime-todo-list
    uses: ./.github/workflows/template-smoke.yml
    with:
      template: ${{ matrix.template }}
      timeout-minutes: 20

  integration:
    name: Integration
    needs: [validate, guardrails]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        template:
          - with-svelte/minimal
          - with-svelte/demo
          - with-svelte/realtime-todo-list
          - with-dioxus/minimal
          - with-dioxus/demo
          - with-dioxus/realtime-todo-list
    uses: ./.github/workflows/template-smoke.yml
    with:
      template: ${{ matrix.template }}
      timeout-minutes: 20
