name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE*"
      - "docs/**"
  push:
    branches: [main, rewrite]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE*"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # All ordinary builds use the committed .sqlx offline cache.
  SQLX_OFFLINE: "true"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: fmt
        run: cargo fmt --all --check
      - name: binding fmt
        run: |
          cargo fmt --manifest-path bindings/node/Cargo.toml -- --check
          cargo fmt --manifest-path bindings/python/Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: binding clippy
        run: |
          cargo clippy --manifest-path bindings/node/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path bindings/python/Cargo.toml --all-targets -- -D warnings
      - name: build
        run: cargo build --all-features
      - name: contract schema and generated files
        run: python3 tools/contract/generate.py --check
      - name: Go migrations match canonical SQL
        run: python3 tools/go-migrations/generate.py --check
      - name: Go conformance fixtures match canonical scenarios
        run: python3 tools/go-conformance/generate.py --check
      - name: Schema ownership manifest matches canonical SQL
        run: python3 tools/schema-ownership/check.py
      - name: client libraries match the core API contract
        run: python3 tools/api-contract/check.py
      - name: skill names match the bindings (skill drift guard)
        run: python3 tools/skill-check/check.py
      - name: unit tests (no database)
        run: cargo test
      - name: complete database-free memory conformance
        run: cargo test --features conformance --test memory_conformance
      - name: lifecycle ownership guard
        run: python3 tools/lifecycle/check.py
      - name: performance budget coverage
        run: python3 tools/performance/check.py --validate-only
  performance:
    name: Performance smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PERF_DATABASE_URL: postgres://postgres:postgres@localhost:5432/forge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: performance
      - name: backend workloads
        run: |
          cargo bench --bench performance -- --backend memory --profile smoke --output memory.json
          cargo bench --bench performance -- --backend postgres --profile smoke --output postgres.json
          cargo bench --bench performance -- --backend filesystem --profile smoke --output filesystem.json
          python3 tools/performance/check.py memory.json
          python3 tools/performance/check.py postgres.json
          python3 tools/performance/check.py filesystem.json
      - name: build package boundaries
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix bindings/node
          npm run build --prefix bindings/node
          uv venv bindings/python/.perf-venv
          uv pip install --python bindings/python/.perf-venv bindings/python
      - name: language boundary workloads
        run: |
          cargo run --release --example performance_boundary -- --output rust.json
          node tools/performance/boundary.mjs --output node.json
          bun tools/performance/boundary.mjs --output bun.json
          bindings/python/.perf-venv/bin/python tools/performance/boundary.py --output python.json
          go -C bindings/go run ./cmd/perf-boundary --output ../../go.json
          for report in rust.json node.json bun.json python.json go.json; do python3 tools/performance/check.py "$report"; done

  node-runtimes:
    name: Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: bindings/node
      - run: npm run build
        working-directory: bindings/node
      - run: npm test
        working-directory: bindings/node

  python-openfeature:
    name: Python OpenFeature provider
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv
        working-directory: bindings/python
      - run: uv pip install --python .venv '.[openfeature]'
        working-directory: bindings/python
      - run: .venv/bin/python -m unittest discover -s test -p 'test_openfeature.py' -v
        working-directory: bindings/python

  bun-runtime:
    name: Bun 1.4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: bindings/node
      - run: bun run build
        working-directory: bindings/node
      - run: bun test test/*.test.js
        working-directory: bindings/node

  go-memory:
    name: Go 1.27 · linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - run: go test ./...
        working-directory: bindings/go
      - run: go test -race ./...
        working-directory: bindings/go

  msrv:
    name: MSRV (1.94.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - run: cargo check --all-features

  embedded:
    name: Embedded Postgres smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: embedded
      # Downloads the pinned PostgreSQL 18 binaries on a cache miss, then boots, migrates,
      # and re-boots a persistent embedded server.
      - run: cargo test --features embedded --test embedded

  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          # Pinned: an unpinned cargo-deny once drifted to a release that rejected
          # deny.toml's `unmaintained = "workspace"` key. These versions are verified.
          tool: cargo-deny@0.19.5,cargo-audit@0.22.1
      - name: cargo deny
        run: cargo deny check
      - name: cargo audit
        run: cargo audit --deny warnings
      - name: audit Node binding lockfile
        run: cargo audit --file bindings/node/Cargo.lock --deny warnings
      - name: audit Python binding lockfile
        run: cargo audit --file bindings/python/Cargo.lock --deny warnings

  sqlx-cache:
    name: SQLx cache integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/forge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: "false"
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --locked --version 0.9.0 --no-default-features --features rustls,postgres
      - name: Apply migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/migrations/bootstrap.sql
          for f in src/migrations/v*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Regenerate .sqlx cache
        run: SQLX_OFFLINE=false cargo sqlx prepare -- --all-targets --all-features
      - name: Verify the committed cache is up to date
        run: git diff --exit-code .sqlx/

  integration:
    name: Integration (pg-tests, PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [validate]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each test creates its own throwaway database off this maintenance URL.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/forge
      # Go's local suite may skip PostgreSQL tests, but this job must never do so.
      FORGE_REQUIRE_POSTGRES_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: "false"
      - name: contract + concurrency + crash-recovery tests
        run: cargo test --features pg-tests -- --test-threads=4
      - name: native Go PostgreSQL tests
        run: go test -run Postgres ./...
        working-directory: bindings/go
      - name: native Go PostgreSQL race tests
        run: go test -race -run Postgres ./...
        working-directory: bindings/go

  s3-conformance:
    name: S3-compatible blob conformance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [validate]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/forge
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_BUCKET: forge-test
      S3_TEST_ACCESS_KEY: forge
      S3_TEST_SECRET_KEY: forge-test-secret
      S3_TEST_DENIED_ACCESS_KEY: forge-readonly
      S3_TEST_DENIED_SECRET_KEY: forge-readonly-secret
      HOSTED_S3_ENDPOINT: ${{ secrets.FORGE_S3_SMOKE_ENDPOINT }}
      HOSTED_S3_BUCKET: ${{ secrets.FORGE_S3_SMOKE_BUCKET }}
      HOSTED_S3_REGION: ${{ secrets.FORGE_S3_SMOKE_REGION }}
      HOSTED_S3_ACCESS_KEY: ${{ secrets.FORGE_S3_SMOKE_ACCESS_KEY }}
      HOSTED_S3_SECRET_KEY: ${{ secrets.FORGE_S3_SMOKE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: s3-conformance
      - name: Start pinned MinIO and configure test identities
        run: |
          docker run --detach --name forge-minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_TEST_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$S3_TEST_SECRET_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9000/minio/health/live
          docker run --rm --entrypoint /bin/sh --network container:forge-minio \
            minio/mc:RELEASE.2025-05-21T01-59-54Z -c \
            "mc alias set local http://127.0.0.1:9000 '$S3_TEST_ACCESS_KEY' '$S3_TEST_SECRET_KEY' >/dev/null && mc mb local/$S3_TEST_BUCKET >/dev/null && mc admin user add local '$S3_TEST_DENIED_ACCESS_KEY' '$S3_TEST_DENIED_SECRET_KEY' >/dev/null && mc admin policy attach local readonly --user '$S3_TEST_DENIED_ACCESS_KEY' >/dev/null"
      - name: Rust S3 conformance
        run: cargo test --features s3-tests --test blob_s3 -- --test-threads=1
      - name: S3 blob performance smoke
        run: |
          PERF_DATABASE_URL="$TEST_DATABASE_URL" PERF_S3_ENDPOINT="$S3_TEST_ENDPOINT" PERF_S3_BUCKET="$S3_TEST_BUCKET" PERF_S3_ACCESS_KEY="$S3_TEST_ACCESS_KEY" PERF_S3_SECRET_KEY="$S3_TEST_SECRET_KEY" cargo bench --bench performance -- --backend s3 --profile smoke --output s3-performance.json
          python3 tools/performance/check.py s3-performance.json
      - name: Native Go S3 conformance
        run: go test -tags=s3test ./...
        working-directory: bindings/go
      - name: Node package S3 smoke
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --silent
          npm run build
          node ../../tools/conformance/s3/node.js
        working-directory: bindings/node
      - name: Python wheel S3 smoke
        run: |
          uvx --from 'maturin>=1.5,<2' maturin build -i python3 --out dist --quiet
          uv venv ../../tools/conformance/python/.venv --clear --quiet
          uv pip install --python ../../tools/conformance/python/.venv --quiet dist/*.whl
          ../../tools/conformance/python/.venv/bin/python ../../tools/conformance/s3/python.py
        working-directory: bindings/python
      - name: Failed uploads leave no multipart state
        run: |
          test -z "$(docker run --rm --entrypoint /bin/sh --network container:forge-minio minio/mc:RELEASE.2025-05-21T01-59-54Z -c "mc alias set local http://127.0.0.1:9000 '$S3_TEST_ACCESS_KEY' '$S3_TEST_SECRET_KEY' >/dev/null && mc ls --incomplete --recursive local/$S3_TEST_BUCKET")"
      - name: Hosted S3 Rust smoke
        if: ${{ env.HOSTED_S3_ENDPOINT != '' && env.HOSTED_S3_BUCKET != '' && env.HOSTED_S3_ACCESS_KEY != '' && env.HOSTED_S3_SECRET_KEY != '' }}
        env:
          S3_TEST_ENDPOINT: ${{ env.HOSTED_S3_ENDPOINT }}
          S3_TEST_BUCKET: ${{ env.HOSTED_S3_BUCKET }}
          S3_TEST_REGION: ${{ env.HOSTED_S3_REGION }}
          S3_TEST_ACCESS_KEY: ${{ env.HOSTED_S3_ACCESS_KEY }}
          S3_TEST_SECRET_KEY: ${{ env.HOSTED_S3_SECRET_KEY }}
        run: cargo test --features s3-tests --test blob_s3 s3_crud_pagination_unicode_ranges_and_preconditions
      - name: Hosted S3 Go smoke
        if: ${{ env.HOSTED_S3_ENDPOINT != '' && env.HOSTED_S3_BUCKET != '' && env.HOSTED_S3_ACCESS_KEY != '' && env.HOSTED_S3_SECRET_KEY != '' }}
        env:
          S3_TEST_ENDPOINT: ${{ env.HOSTED_S3_ENDPOINT }}
          S3_TEST_BUCKET: ${{ env.HOSTED_S3_BUCKET }}
          S3_TEST_REGION: ${{ env.HOSTED_S3_REGION }}
          S3_TEST_ACCESS_KEY: ${{ env.HOSTED_S3_ACCESS_KEY }}
          S3_TEST_SECRET_KEY: ${{ env.HOSTED_S3_SECRET_KEY }}
        run: go test -tags=s3test -run TestS3CRUDPaginationStreamingAndPresign ./...
        working-directory: bindings/go

  conformance:
    name: Conformance (cross-language)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [validate]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each scenario creates its own throwaway database off this maintenance URL.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/forge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: "false"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - uses: astral-sh/setup-uv@v5
      # Builds the native bindings and runs the shared conformance runners; each
      # exits non-zero iff its failure set differs from src/conformance/known_gaps.json.
      - name: run all conformance runners
        run: bash tools/conformance/run-all.sh
      # The native addon was just built by run-all.sh; exercise the pure-JS wrapper.
      - name: node wrapper unit tests
        run: npm test
        working-directory: bindings/node
      - name: python wrapper unit tests
        run: tools/conformance/python/.venv/bin/python -m unittest discover -s bindings/python/test
