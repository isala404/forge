name: Docker otel-lgtm

on:
  push:
    branches: [main]
    paths:
      - "docker/otel-lgtm/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/isala404/forge/otel-lgtm

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Extract otel-lgtm version from Dockerfile
        id: version
        run: |
          VERSION=$(grep -oP 'FROM grafana/otel-lgtm:\K[^\s]+' docker/otel-lgtm/Dockerfile)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "otel-lgtm version: $VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/otel-lgtm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
