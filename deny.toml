[graph]
all-features = true

[advisories]
yanked = "warn"
unmaintained = "workspace"
ignore = [
    # See .cargo/audit.toml: rsa advisory, reachable only via the unused sqlx-mysql
    # driver that sqlx's macro crate compiles. Forge is Postgres-only.
    "RUSTSEC-2023-0071",
]

[licenses]
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
