[package]
name = "forge-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-process test harness for Forge: spins up gateway + worker + reactor against a temporary Postgres and exposes a faithful HTTP+SSE client"
publish = false

[lints]
workspace = true

[features]
# Scenario tests boot a real Postgres via testcontainers, so they need Docker.
# Gating the test binaries and the testcontainers deps keeps
# `cargo test --workspace` Docker-free; CI runs them with this feature on in a
# Docker-enabled job (`cargo test -p forge-harness --features testcontainers`).
testcontainers = [
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "forge/testcontainers",
    "forge-core/testcontainers",
    "forge-runtime/testcontainers",
]

[dependencies]
forge = { workspace = true, features = ["full"] }
forge-core = { workspace = true }
forge-runtime = { workspace = true, features = ["full"] }

tokio = { workspace = true }
tokio-util = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
eventsource-stream = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
