[package]
name = "forgex"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI and runtime for the Forge full-stack framework"
keywords = ["framework", "postgresql", "full-stack", "cli"]
categories = ["web-programming", "command-line-utilities"]

[lib]
name = "forgex"
path = "src/lib.rs"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../forge-core" }
forge-runtime = { path = "../forge-runtime" }
forge-codegen = { path = "../forge-codegen" }
forge-macros = { path = "../forge-macros" }

tokio = { workspace = true }
tokio-util = "0.7"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
dialoguer = "0.12"
dotenvy = "0.15"
indicatif = "0.18"
hostname = "0.4"
reqwest = { version = "0.12", features = ["json"] }
axum = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
testing = ["forge-core/testing"]
