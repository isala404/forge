[package]
name = "forge-dioxus"
version = "0.7.1"
edition = "2024"
description = "Dioxus runtime client for the Forge full-stack framework"
license = "MIT"
repository = "https://github.com/isala404/forge"
keywords = ["forge", "dioxus", "fullstack", "wasm"]
categories = ["web-programming", "wasm"]

[lib]
name = "forge_dioxus"
path = "src/lib.rs"

[dependencies]
dioxus = { version = "=0.7.3", features = ["web"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
futures-timer = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.6", features = ["http", "eventsource"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "EventSource", "File", "FormData", "MessageEvent"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
reqwest-eventsource = "0.6"
