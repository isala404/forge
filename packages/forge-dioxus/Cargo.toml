[package]
name = "forge-dioxus"
version = "0.10.1"
edition = "2024"
description = "Dioxus runtime client for the Forge full-stack framework"
license = "MIT"
repository = "https://github.com/isala404/forge"
keywords = ["forge", "dioxus", "fullstack", "wasm"]
categories = ["web-programming", "wasm"]

[lib]
name = "forge_dioxus"
path = "src/lib.rs"

[features]
default = ["router"]
router = ["dioxus/router"]

[dependencies]
dioxus = { version = "=0.7.5", default-features = false, features = ["hooks", "html", "macro", "signals"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
futures-channel = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.6", features = ["http", "eventsource"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "Document", "ErrorEvent", "EventSource", "File", "FormData", "Location", "MessageEvent", "Navigator", "PromiseRejectionEvent", "RequestCredentials", "Storage", "UrlSearchParams", "VisibilityState", "Window"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
reqwest-eventsource = "0.6"
tokio = { version = "1.47", features = ["time"] }
dirs = "6"
