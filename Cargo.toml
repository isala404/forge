[package]
name = "forgelib"
version = "1.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
repository = "https://github.com/isala404/forge"
homepage = "https://isala404.github.io/forge/"
documentation = "https://docs.rs/forgelib"
readme = "README.md"
description = "The standard library for agent-built SaaS: hardened infra primitives on Postgres"
keywords = ["postgres", "queue", "kv", "primitives", "backend"]
categories = ["database", "asynchronous"]
include = [
    "/src/**",
    "/sql/forge_outbox_v1.sql",
    "/contract/invalidation-v1.schema.json",
    "/contract/interop-vectors.json",
    "/contract/scope-vectors.json",
    "/.sqlx/**",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/SECURITY.md",
]

[lib]
name = "forgelib"
path = "src/lib.rs"

[features]
default = []
# One-line OTLP export wiring for traces. Without it, spans still flow to whatever
# `tracing` subscriber the app installs.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]
# Official OpenFeature provider and an application-scoped OpenTelemetry evaluation hook.
openfeature = ["dep:open-feature"]
# Provisions a real Postgres server on demand when forge.toml sets
# `[postgres] embedded = true`: binaries download once per machine (to
# ~/.theseus/postgresql), data persists under `.forge/pg`. Local dev without
# installing Postgres; both language bindings ship with it enabled.
embedded = ["dep:postgresql_embedded"]
# Gates the DB-backed integration tests. The public `forgelib::testing` module is always
# available for memory factories and per-test isolated PostgreSQL databases. A sentinel
# test fails loudly if TEST_DATABASE_URL is unset, so "0 tests ran" cannot masquerade as a pass.
pg-tests = []
# Exposes `forge::conformance` for external backend authors and the cross-language runner.
conformance = []
# Runs the live S3-compatible integration suite. CI wires a pinned MinIO service.
s3-tests = ["pg-tests"]

[dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"], default-features = false }
async-trait = "0.1"

sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
] }

bytes = "1.10"
# Streams: the pubsub primitive returns a boxed Stream of LISTEN/NOTIFY messages.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
# Config files. `${VAR}` env interpolation is a small in-house helper over toml::Value;
# no figment/config layer, to keep the dependency surface minimal.
toml = "1.1"
uuid = { version = "1.19", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }

thiserror = "2.0"

sha2 = "0.11"

# Blob presigned URLs: HMAC-SHA256 signing + percent-encoding the key into the URL.
hmac = "0.13"
percent-encoding = "2.3"

# Auth: argon2id password hashing (PHC strings) + a CSPRNG for salts and tokens.
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

# Observability — always-on spans + metrics facade; no exporter required.
tracing = "0.1"
open-feature = { version = "0.3.0", optional = true, features = ["serde_json"] }

postgresql_embedded = { version = "0.20.4", optional = true, default-features = false, features = ["theseus", "rustls", "tokio"] }

opentelemetry = { version = "0.32", optional = true, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", optional = true, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", optional = true, default-features = false, features = ["http-json", "reqwest-rustls", "trace"] }
tracing-opentelemetry = { version = "0.33", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }
aws-config = { version = "=1.11.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
    "credentials-process",
    "sso",
] }
aws-sdk-s3 = { version = "=1.144.0", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
aws-credential-types = "=1.3.0"
aws-smithy-types = { version = "=1.6.2", features = ["rt-tokio"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
proptest = "1.11"
stats_alloc = "0.1.10"

[[bench]]
name = "performance"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
indexing_slicing = "deny"
disallowed_methods = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = true
codegen-units = 1
strip = true
