[package]
name = "forge-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/isala404/forge"
description = "The standard library for agent-built SaaS: hardened infra primitives on Postgres"
keywords = ["postgres", "queue", "kv", "primitives", "backend"]
categories = ["database", "asynchronous"]

# The library is `forge` even though the package is `forge-rs`, for clean `use forge::...`.
[lib]
name = "forge"
path = "src/lib.rs"

[features]
default = ["postgres"]
# The Postgres backend implements every primitive. It is the only backend in v0.1;
# the feature exists so future backends (redis, s3) slot in behind the same structure.
postgres = []
# One-line OTLP export wiring for traces. Without it, spans still flow to whatever
# `tracing` subscriber the app installs.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]
# Enables the `forge::testing` harness (per-test isolated databases) and gates the
# DB-backed integration tests. A sentinel test fails loudly if TEST_DATABASE_URL is unset,
# so "0 tests ran" cannot masquerade as a pass.
pg-tests = []
# The optional axum router that serves presigned blob URLs against the Postgres
# backend (`forge.blob_router()`). Off by default; presign signing works without it.
blob-router = ["dep:axum"]

[dependencies]
# Async + runtime
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
async-trait = "0.1"

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
] }

# Values + serialization
bytes = "1.10"
# Streams: the pubsub primitive returns a boxed Stream of LISTEN/NOTIFY messages.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.19", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }

# Errors
thiserror = "2.0"

# Hashing (migration checksums, key hashing in spans)
sha2 = "0.10"

# Blob presigned URLs: HMAC-SHA256 signing + percent-encoding the key into the URL.
hmac = "0.12"
percent-encoding = "2.3"

# Auth: argon2id password hashing (PHC strings) + a CSPRNG for salts and tokens.
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

# Observability — always-on spans + metrics facade; no exporter required.
tracing = "0.1"
metrics = "0.24"

# OTLP export (feature = "otel")
opentelemetry = { version = "0.27", optional = true, features = ["trace"] }
opentelemetry_sdk = { version = "0.27", optional = true, features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.27", optional = true, default-features = false, features = ["http-json", "reqwest-rustls", "trace"] }
tracing-opentelemetry = { version = "0.28", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }

# Blob presign router (feature = "blob-router")
axum = { version = "0.8", optional = true, default-features = false, features = ["tokio", "http1", "query"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
indexing_slicing = "deny"
disallowed_methods = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
strip = true
