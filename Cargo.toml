[workspace]
resolver = "2"
members = [
    "crates/forge",
    "crates/forge-core",
    "crates/forge-macros",
    "crates/forge-runtime",
    "crates/forge-codegen",
    "examples/todo",
    "examples/kanban-board",
    "examples/support-desk",
]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/isala404/forge"
description = "Full-stack framework with PostgreSQL as the only infrastructure dependency"
keywords = ["framework", "postgresql", "full-stack", "backend", "web"]
categories = ["web-programming", "database"]

[workspace.dependencies]
# FORGE packages (use these for examples and internal crates)
# Note: The package is named "forgex" but the library is "forge" for cleaner imports
forge = { package = "forgex", path = "crates/forge" }
forge-core = { path = "crates/forge-core" }
forge-macros = { path = "crates/forge-macros" }
forge-runtime = { path = "crates/forge-runtime" }
forge-codegen = { path = "crates/forge-codegen" }

# Async runtime
tokio = { version = "1.48", features = ["full"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
schemars = { version = "0.8", features = ["chrono", "uuid1"] }

# HTTP/WebSocket
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Utilities
uuid = { version = "1.19", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
bytes = "1.10"
cron = "0.15"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-opentelemetry = "0.28"

# OpenTelemetry
opentelemetry = { version = "0.27", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-json", "reqwest-client", "trace", "metrics", "logs", "internal-logs"] }
opentelemetry-semantic-conventions = "0.27"
opentelemetry-appender-tracing = "0.27"

# Proc macros
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
quote = "1.0"
proc-macro2 = "1.0"

# SQL parsing
sqlparser = "0.54"

# Concurrent data structures
dashmap = "6"

# Testing
tokio-test = "0.4"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

# Example dependencies
dotenvy = "0.15"
bcrypt = "0.17"
jsonwebtoken = "9"
rust-embed = "8"
mime_guess = "2"
which = "7"

[workspace.lints.rust]
unsafe_code = "deny"
dead_code = "deny"

[workspace.lints.clippy]
panic = "deny"
unimplemented = "deny"
unwrap_used = "deny"
indexing_slicing = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
