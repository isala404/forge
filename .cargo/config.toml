[env]
SQLX_OFFLINE = "true"

# Faster linkers cut incremental rebuild times by 40-70% on this project.
# These targets opt-in via env if the linker is installed; otherwise cargo
# falls back to the system default. Keeping this commented avoids forcing a
# tool install on contributors who don't have mold/lld locally.
#
# To enable on Linux (preferred):
#   sudo apt install mold      # or: cargo install --locked sccache
#   export RUSTFLAGS="-C link-arg=-fuse-ld=mold"
#
# To enable on macOS:
#   export RUSTFLAGS="-C link-arg=-fuse-ld=lld"
#
# To enable sccache (caches across `cargo clean`):
#   export RUSTC_WRAPPER=sccache
#
# Documented here so contributors can find the levers without grepping CI.