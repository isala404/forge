# cargo-audit configuration.
[advisories]
ignore = [
    # RUSTSEC-2023-0071 (rsa "Marvin Attack" timing sidechannel). Pulled in only
    # transitively through `sqlx-mysql`, which sqlx's macro crate compiles for all
    # drivers. Forge is Postgres-only and never executes the MySQL/`rsa` path, so
    # the vulnerable code is unreachable. No fixed `rsa` release exists yet; revisit
    # when one ships or when sqlx stops pulling unused drivers into the macro build.
    "RUSTSEC-2023-0071",
]
