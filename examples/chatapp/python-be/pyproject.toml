[project]
name = "chatapp-python-be"
version = "0.1.0"
description = "chatapp Python GraphQL backend (FastAPI + Strawberry + forgelib)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    # uvicorn needs a WebSocket backend to serve GraphQL subscriptions; without it the
    # server rejects every WS upgrade with a 400 and live subscriptions silently break.
    # It's a runtime dependency, not dev-only — the Docker image installs with --no-dev.
    "websockets>=14",
    "strawberry-graphql[fastapi]>=0.260",
    "asyncpg>=0.30",
    "forgelib",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.uv.sources]
forgelib = { path = "../../../bindings/forge-py", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# uvicorn's bundled websockets server backend emits these; not our code.
filterwarnings = [
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
    "ignore:remove second argument of ws_handler:DeprecationWarning",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
