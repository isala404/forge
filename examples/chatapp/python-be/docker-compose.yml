# Self-contained python-be stack on its own prefixed private network: Postgres +
# the GraphQL backend + the shared React SPA.
#   docker compose -f examples/chatapp/python-be/docker-compose.yml up --build
# Backend on http://127.0.0.1:8083/graphql ; SPA on http://127.0.0.1:8093
# Service/network names are prefixed (pybe-) so this file composes cleanly into a
# multi-stack file without clashing.
name: chatapp-python-be

services:
  pybe-db:
    image: postgres:18
    shm_size: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: chatapp
    volumes:
      # pg18 crash-loops if PGDATA lands on /data; keep it on /var/lib/postgresql.
      - pybe-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatapp"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [pybe-net]

  pybe-backend:
    # Build context is the repo root — the backend has path deps on bindings/python.
    build:
      context: ../../..
      dockerfile: examples/chatapp/python-be/Dockerfile
    environment:
      FORGE_POSTGRES_URL: postgres://postgres:forge@pybe-db:5432/chatapp
      FORGE_BLOB_SIGNING_SECRET: dev-secret-change-me
      PORT: "8083"
      CORS_ORIGIN: "*"
      APP_PRESENCE_TTL_SECS: "30"
      APP_SCHEDULER_MS: "1000"
      APP_DISAPPEARING_SECS: "86400"
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      pybe-db:
        condition: service_healthy
    networks: [pybe-net]

  pybe-react-fe:
    # Multi-stage: vite build then serve the static bundle via nginx (see ../react-fe).
    build:
      context: ../react-fe
    environment:
      # Point the browser at the backend's PUBLISHED URL (host-reachable), not the
      # in-network service name — these are consumed by the SPA at runtime.
      # Override via the environment (e.g. `--env-file .env.orb`) when 127.0.0.1 ports
      # aren't host-reachable, as on OrbStack; the defaults suit Docker Desktop.
      VITE_GRAPHQL_HTTP: ${PYBE_GRAPHQL_HTTP:-http://127.0.0.1:8083/graphql}
      VITE_GRAPHQL_WS: ${PYBE_GRAPHQL_WS:-ws://127.0.0.1:8083/graphql}
      # Presigned blob URLs are relative (`/api/files`), so nginx proxies them to
      # the backend on the internal network — reachable regardless of host port
      # forwarding, so uploads work on both Docker Desktop and OrbStack unchanged.
      BACKEND_ORIGIN: http://pybe-backend:8083
    ports:
      - "127.0.0.1:8093:80"
    depends_on:
      - pybe-backend
    networks: [pybe-net]

networks:
  pybe-net:

volumes:
  pybe-pg:
