[package]
name = "chatapp-rust-be"
version = "0.1.0"
edition = "2024"

# Stand alone: do not get absorbed into any ancestor cargo workspace.
[workspace]

[dependencies]
anyhow = "1"
async-graphql = { version = "7.0.18", features = ["chrono", "dataloader"] }
async-graphql-axum = "7.0.18"
axum = { version = "0.8", features = ["ws", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
forgelib = { path = "../../../", features = ["embedded"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Match forge's sqlx (0.8) so the app shares Forge's pool via `forge.pool()`
# instead of opening a second one (the types must be the same crate version).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.24"
