# Self-contained Rust chatapp: Postgres + backend + React SPA, each on a prefixed
# private network so this file can also be `include`d alongside the other backends
# without clashing.
#
#   docker compose up --build        (run from this directory)
#
#   backend  -> http://127.0.0.1:8081   (Rust · forge crate, GraphQL)
#   react-fe -> http://127.0.0.1:8091   (Vite build served by nginx)
name: rs-chatapp

services:
  rs-db:
    image: postgres:18
    shm_size: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: chatapp_rust
    volumes:
      # pg18 stores its cluster under /var/lib/postgresql/<ver>; mounting the volume
      # at the parent (NOT /data) is what keeps it from crash-looping on restart.
      - rs_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatapp_rust"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [rs-net]

  rs-app:
    build:
      # Repo root: the example's Cargo.toml has a path dep on the forge crate
      # (forge = { path = "../../../" }), so the whole tree must be in context.
      context: ../../..
      dockerfile: examples/chatapp/rust-be/Dockerfile
    environment:
      # db::migrate applies migrations.sql against this pool on startup.
      FORGE_POSTGRES_URL: postgres://postgres:forge@rs-db:5432/chatapp_rust
      FORGE_BLOB_SIGNING_SECRET: dev-secret-change-me
      PORT: "8081"
      BIND: 0.0.0.0
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      rs-db:
        condition: service_healthy
    networks: [rs-net]

  rs-fe:
    build:
      context: ../react-fe
    environment:
      # The browser talks to the backend at its published host URL, not the in-network
      # service name. docker-entrypoint.sh bakes these into /env.js at container start.
      # rust-be serves queries and the WS upgrade on the same /graphql endpoint.
      # Override via the environment (e.g. `--env-file .env.orb`) when 127.0.0.1 ports
      # aren't host-reachable, as on OrbStack; the defaults suit Docker Desktop.
      VITE_GRAPHQL_HTTP: ${RS_GRAPHQL_HTTP:-http://localhost:8081/graphql}
      VITE_GRAPHQL_WS: ${RS_GRAPHQL_WS:-ws://localhost:8081/graphql}
      # Presigned blob URLs are relative (`/api/files`), so nginx proxies them to
      # the backend on the internal network — reachable regardless of host port
      # forwarding, so uploads work on both Docker Desktop and OrbStack unchanged.
      BACKEND_ORIGIN: http://rs-app:8081
    ports:
      - "127.0.0.1:8091:80"
    depends_on:
      - rs-app
    networks: [rs-net]

networks:
  rs-net:

volumes:
  rs_pg:
