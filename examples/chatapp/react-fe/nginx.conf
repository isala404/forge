server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers apply to every response. CSP stays permissive for connect/img
  # because the backend host is injected at runtime via env.js and is cross-origin,
  # and blob images load from the backend origin.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http: https: ws: wss:; img-src 'self' data: blob: http: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

  # env.js carries runtime backend config; never cache it.
  location = /env.js {
    add_header Cache-Control "no-store";
  }

  # Presigned blob traffic. The app mints relative URLs (default base `/api/files`),
  # so the browser sends them to this SPA origin; proxy them through to the backend,
  # which actually verifies the signature and stores/serves the bytes. Keeping it same
  # origin means uploads work identically on Docker Desktop and OrbStack with no
  # per-environment URL override. BACKEND_ORIGIN is substituted in at container start
  # (see Dockerfile NGINX_ENVSUBST_FILTER); it points at the backend on the internal
  # docker network, e.g. http://node-app:8082.
  location /api/files {
    proxy_pass ${BACKEND_ORIGIN};
    proxy_set_header Host $host;
    # Match the backend's object cap so a large attachment reaches it instead of
    # being rejected here with a 413.
    client_max_body_size 50m;
    proxy_request_buffering off;
  }

  # Hashed assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
