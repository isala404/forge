[package]
name = "forge-svelte-minimal-template"
version = "0.10.0"
edition = "2024"
rust-version = "1.92"
publish = false

[features]
default = ["embedded-frontend"]
embedded-frontend = ["dep:rust-embed", "forge/embedded-frontend"]

[dependencies]
forge = { workspace = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros"] }
dotenvy = "0.15"
rust-embed = { version = "8", optional = true }

[build-dependencies]
which = "7"
