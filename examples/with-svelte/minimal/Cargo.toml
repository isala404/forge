[package]
name = "forge-svelte-minimal-template"
version = "0.9.0"
edition = "2024"
rust-version = "1.92"
publish = false

[features]
default = ["embedded-frontend"]
embedded-frontend = ["dep:rust-embed", "forge/embedded-frontend"]

[dependencies]
forge = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
dotenvy = { workspace = true }
rust-embed = { workspace = true, optional = true }

[build-dependencies]
which = { workspace = true }
