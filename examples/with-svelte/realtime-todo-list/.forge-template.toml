template_id = "with-svelte/realtime-todo-list"
frontend = "sveltekit"
canonical_internal_slug = "todo"

rewrite_paths = [
  "Cargo.toml",
  "forge.toml",
  ".env",
  ".env.example",
  "docker-compose.yml",
  "Dockerfile",
  "README.md",
  "frontend/package.json",
]

copy_exclude = [
  ".forge-template.toml",
  "pg_data",
  "target",
  "node_modules",
  ".svelte-kit",
  "build",
  "dist",
  "playwright-report",
  "test-results",
  ".forge-dev-integration.log",
  "skills",
  "package-lock.json",
  "bun.lock",
  "Cargo.lock",
  "frontend/Cargo.lock",
  "frontend/target",
]

[[replacement]]
from = "todo-frontend"
to = "{{frontend_package_name}}"
files = ["frontend/package.json"]

[[replacement]]
from = "name = \"todo\""
to = "name = \"{{project_slug}}\""
files = ["Cargo.toml", "forge.toml"]

[[replacement]]
from = "postgres://postgres:forge@localhost:5432/todo"
to = "postgres://postgres:forge@localhost:5432/{{project_db_name}}"
files = [".env", ".env.example"]

[[replacement]]
from = "POSTGRES_DB=todo"
to = "POSTGRES_DB={{project_db_name}}"
files = [".env", ".env.example"]

[[replacement]]
from = "postgres://postgres:forge@db:5432/todo"
to = "postgres://postgres:forge@db:5432/{{project_db_name}}"
files = ["docker-compose.yml"]

[[replacement]]
from = "pg_isready -U postgres -d todo"
to = "pg_isready -U postgres -d {{project_db_name}}"
files = ["docker-compose.yml"]

[[replacement]]
from = "# todo"
to = "# {{project_slug}}"
files = ["README.md"]

[[replacement]]
from = "todo/"
to = "{{project_slug}}/"
files = ["README.md"]

# Pin the skill install URL to the CLI's release tag
[[replacement]]
from = "tree/main/docs/skills/forge-idiomatic-engineer"
to = "tree/v{{forge_version}}/docs/skills/forge-idiomatic-engineer"
files = ["README.md"]

# Convert workspace dep to standalone versioned dep
[[replacement]]
from = 'forge = { workspace = true }'
to = 'forge = { version = "{{forge_version}}", package = "forgex" }'
files = ["Cargo.toml"]

# Use published otel-lgtm image instead of local build context
[[replacement]]
from = "build: ../../../docker/otel-lgtm"
to = "image: grafana/otel-lgtm:0.22.1"
files = ["docker-compose.yml"]

# Convert workspace-relative docker-compose to standalone
[[replacement]]
from = "- ../../..:/workspace"
to = "- .:/app"
files = ["docker-compose.yml"]

[[replacement]]
from = "- ./target:/workspace/examples/with-svelte/realtime-todo-list/target"
to = "- ./target:/app/target"
files = ["docker-compose.yml"]

[[replacement]]
from = "working_dir: /workspace/examples/with-svelte/realtime-todo-list"
to = "working_dir: /app"
files = ["docker-compose.yml"]

[[replacement]]
from = "\n      - ../../../packages/forge-svelte:/packages/forge-svelte"
to = ""
files = ["docker-compose.yml"]

# Convert workspace-relative npm dep to published version
[[replacement]]
from = '"file:../../../../packages/forge-svelte"'
to = '"{{forge_version}}"'
files = ["frontend/package.json"]

# Dockerfile binary name
[[replacement]]
from = "release/todo"
to = "release/{{project_slug}}"
files = ["Dockerfile"]

[[replacement]]
from = "/app/todo"
to = "/app/{{project_slug}}"
files = ["Dockerfile"]
