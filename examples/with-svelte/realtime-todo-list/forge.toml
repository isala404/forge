# FORGE Configuration
# See https://tryforge.dev/docs/api/configuration for all options

[project]
name = "todo"
# version = "0.1.0"

[database]
url = "${DATABASE_URL}"
# pool_size = 50
# statement_timeout = "30s"
# replica_urls = ["${DATABASE_REPLICA_URL}"]  # Read replica for scaling reads
# read_from_replica = false

[gateway]
port = 9081
cors_enabled = true
cors_origins = ["${CORS_ORIGIN-http://localhost:9080}", "http://127.0.0.1:9080"]
# request_timeout = "30s"
# max_body_size = "10mb"
# quiet_paths = ["/_api/health", "/_api/ready"]  # Routes excluded from traces/metrics/logs

[observability]
enabled = ${FORGE_OTEL_ENABLED-false}
otlp_endpoint = "${FORGE_OTEL_ENDPOINT-http://localhost:4318}"
# log_level = "info"                         # debug, info, warn, error
# enable_traces = true                       # per-signal toggle
# enable_metrics = true
# enable_logs = true
# sampling_ratio = 1.0                       # trace sampling (0.0-1.0), lower = less storage

# [function]
# max_concurrent = 100   # max in-flight RPCs
# timeout = "30s"
# memory_limit = "512mb"

# [worker]
# max_concurrent_jobs = 4
# job_timeout = "5m"
# poll_interval = "1s"

[auth]
jwt_algorithm = "HS256"
jwt_secret = "${JWT_SECRET}"
jwt_audience = "${JWT_AUDIENCE}"

# Legacy template values below kept for reference.
# jwt_algorithm = "HS256"           # HS256, HS384, HS512, RS256, RS384, RS512
#
# --- HMAC (HS256/HS384/HS512) - symmetric, use for self-issued tokens ---
# jwt_secret = "${JWT_SECRET}"      # Shared secret for signing/verifying
#
# --- RSA (RS256/RS384/RS512) - asymmetric, use for external providers ---
# jwks_url = ""                     # Provider's JWKS endpoint for public keys
#
# --- Claims validation (recommended for external providers) ---
# jwt_issuer = ""                   # Expected `iss` claim
# jwt_audience = ""                 # Expected `aud` claim
#
# --- Common provider JWKS URLs ---
# Firebase:  https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
# Auth0:     https://YOUR_DOMAIN.auth0.com/.well-known/jwks.json
# Clerk:     https://YOUR_DOMAIN.clerk.accounts.dev/.well-known/jwks.json
# Supabase:  https://YOUR_PROJECT.supabase.co/auth/v1/jwks
#
# Firebase example:
#   jwt_algorithm = "RS256"
#   jwks_url = "https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com"
#   jwt_issuer = "https://securetoken.google.com/YOUR_PROJECT_ID"
#   jwt_audience = "YOUR_PROJECT_ID"

[rate_limit]
# hybrid: per-node DashMap fast path (DDoS-grade). strict: PG round-trip (billing-grade).
mode = "hybrid"
max_local_buckets = 10000
# Per-handler quotas live on the function macros, e.g.
#   #[forge::mutation(rate_limit_requests = 10, rate_limit_per_secs = 60, rate_limit_key = "ip")]

# [cluster]
# name = "node-1"            # auto-generated if omitted
# discovery = "static"       # static, dns
# heartbeat_interval = "5s"
# dead_threshold = "30s"
# seed_nodes = ["node-2:9081", "node-3:9081"]

