[package]
name = "todo"
version = "0.10.1"
edition = "2024"
rust-version = "1.92"
publish = false

[features]
default = []
embedded-frontend = ["dep:rust-embed", "forge/embedded-frontend"]
testcontainers = ["forge/testcontainers"]

[dependencies]
forge = { workspace = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros", "derive"] }
dotenvy = "0.15"
rust-embed = { version = "8", optional = true }

[build-dependencies]
which = "7"
