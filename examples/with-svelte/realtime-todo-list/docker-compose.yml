services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    working_dir: /workspace/examples/with-svelte/realtime-todo-list
    ports:
      - "127.0.0.1:9081:9081"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:forge@db:5432/todo
      - SQLX_OFFLINE=true
      - FORGE_OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel:4318
    command: cargo watch --poll -x "run --no-default-features"
    volumes:
      - ../../..:/workspace
      - cargo_cache:/usr/local/cargo/registry
      - ./target:/workspace/examples/with-svelte/realtime-todo-list/target
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9081/_api/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install && bun run dev --host 0.0.0.0 --port 9080"
    ports:
      - "127.0.0.1:9080:9080"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - ./frontend/node_modules:/app/node_modules
      - ../../../packages/forge-svelte:/packages/forge-svelte
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:18
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo"]
      interval: 5s
      timeout: 5s
      retries: 5

  otel:
    build: ../../../docker/otel-lgtm
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db

volumes:
  postgres_data:
  cargo_cache:
