[project]
name = "todoapp-python-be"
version = "0.1.0"
description = "todoapp Python REST backend (FastAPI + forge-py)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "forge-py",
]

[tool.uv.sources]
forge-py = { path = "../../../bindings/forge-py", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
