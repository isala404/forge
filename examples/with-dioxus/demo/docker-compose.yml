services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    working_dir: /workspace/examples/with-dioxus/demo
    ports:
      - "127.0.0.1:9081:9081"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:forge@db:5432/forge_dioxus_demo_template
      - SQLX_OFFLINE=true
      - FORGE_OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel:4318
    command: cargo watch --poll -x "run --no-default-features"
    volumes:
      - ../../..:/workspace
      - cargo_cache:/usr/local/cargo/registry
      - ./target:/workspace/examples/with-dioxus/demo/target
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9081/_api/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  db:
    image: postgres:18
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forge_dioxus_demo_template"]
      interval: 5s
      timeout: 5s
      retries: 5

  otel:
    build: ../../../docker/otel-lgtm
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db

volumes:
  postgres_data:
  cargo_cache:
