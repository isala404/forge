template_id = "with-dioxus/demo"
frontend = "dioxus"
canonical_internal_slug = "forge-dioxus-demo-template"

rewrite_paths = [
  "Cargo.toml",
  "forge.toml",
  ".env",
  ".env.example",
  "docker-compose.yml",
  "Dockerfile",
  "README.md",
  "frontend/Cargo.toml",
  "frontend/Dioxus.toml",
  "frontend/src/main.rs",
  "frontend/src/layout.rs",
  "frontend/src/pages/demo.rs",
  "frontend/tests/home.spec.ts",
]

copy_exclude = [
  ".forge-template.toml",
  "pg_data",
  "target",
  "node_modules",
  ".svelte-kit",
  "build",
  "dist",
  "playwright-report",
  "test-results",
  ".forge-dev-integration.log",
  "skills",
  "package-lock.json",
  "bun.lock",
  "Cargo.lock",
  "frontend/Cargo.lock",
  "frontend/target",
]

[[replacement]]
from = "forge-dioxus-demo-template-frontend"
to = "{{frontend_package_name}}"
files = ["frontend/Cargo.toml"]

[[replacement]]
from = "name = \"forge-dioxus-demo-template\""
to = "name = \"{{project_slug}}\""
files = ["Cargo.toml", "forge.toml"]

[[replacement]]
from = "POSTGRES_DB=forge_dioxus_demo_template"
to = "POSTGRES_DB={{project_db_name}}"
files = [".env", ".env.example"]

[[replacement]]
from = "postgres://postgres:forge@db:5432/forge_dioxus_demo_template"
to = "postgres://postgres:forge@db:5432/{{project_db_name}}"
files = ["docker-compose.yml"]

[[replacement]]
from = "pg_isready -U postgres -d forge_dioxus_demo_template"
to = "pg_isready -U postgres -d {{project_db_name}}"
files = ["docker-compose.yml"]

[[replacement]]
from = "# demo"
to = "# {{project_slug}}"
files = ["README.md"]

[[replacement]]
from = "demo/"
to = "{{project_slug}}/"
files = ["README.md"]

[[replacement]]
from = "\"demo\""
to = "\"{{project_slug}}\""
files = ["frontend/src/main.rs", "frontend/tests/home.spec.ts"]

[[replacement]]
from = "Forge Demo"
to = "{{project_name}}"
files = ["frontend/src/main.rs", "frontend/src/layout.rs"]

[[replacement]]
from = 'name = "demo-frontend"'
to = 'name = "{{frontend_package_name}}"'
files = ["frontend/Dioxus.toml"]

[[replacement]]
from = 'title = "demo"'
to = 'title = "{{project_name}}"'
files = ["frontend/Dioxus.toml"]

[[replacement]]
from = 'identifier = "com.forge.demo"'
to = 'identifier = "com.forge.{{project_slug}}"'
files = ["frontend/Dioxus.toml"]

[[replacement]]
from = "forge-dioxus-demo-template"
to = "{{project_slug}}"
files = ["Dockerfile"]

# Convert workspace dep to standalone versioned dep
[[replacement]]
from = 'forge = { workspace = true }'
to = 'forge = { version = "{{forge_version}}", package = "forgex" }'
files = ["Cargo.toml"]

# Convert path dep to published version
[[replacement]]
from = 'forge-dioxus = { path = "../../../../packages/forge-dioxus" }'
to = 'forge-dioxus = { version = "{{forge_version}}" }'
files = ["frontend/Cargo.toml"]

# Use published otel-lgtm image instead of local build context
[[replacement]]
from = "build: ../../../docker/otel-lgtm"
to = "image: grafana/otel-lgtm:0.22.1"
files = ["docker-compose.yml"]

# Convert workspace-relative docker-compose to standalone
[[replacement]]
from = "- ../../..:/workspace"
to = "- .:/app"
files = ["docker-compose.yml"]

[[replacement]]
from = "- ./target:/workspace/examples/with-dioxus/demo/target"
to = "- ./target:/app/target"
files = ["docker-compose.yml"]

[[replacement]]
from = "working_dir: /workspace/examples/with-dioxus/demo"
to = "working_dir: /app"
files = ["docker-compose.yml"]
