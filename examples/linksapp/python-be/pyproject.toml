[project]
name = "linksapp-python-be"
version = "0.1.0"
description = "linksapp Python REST backend (FastAPI + forgelib)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "forgelib",
    "segno>=1.6",
]

[project.scripts]
forge-migrate = "app.migrate:main"

[tool.uv.sources]
forgelib = { path = "../../../bindings/python", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
